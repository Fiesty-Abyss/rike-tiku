spring:
  application:
    name: rike-tiku-backend
  datasource:
    url: jdbc:mysql://${RIKE_TIKU_DB_HOST:localhost}:${RIKE_TIKU_DB_PORT:3306}/${RIKE_TIKU_DB_NAME:rike_tiku}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${RIKE_TIKU_DB_USERNAME:root}
    password: ${RIKE_TIKU_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: ${RIKE_TIKU_BACKEND_PORT:8081}

app:
  cors:
    allowed-origins: ${RIKE_TIKU_CORS_ALLOWED_ORIGINS:http://localhost:8080}
  jwt:
    secret: ${RIKE_TIKU_JWT_SECRET:}
    expiration-seconds: ${RIKE_TIKU_JWT_EXPIRATION_SECONDS:7200}
  auth:
    captcha:
      expose-test-code: ${RIKE_TIKU_CAPTCHA_EXPOSE_TEST_CODE:false}
  ai:
    enabled: ${RIKE_TIKU_AI_ENABLED:false}
    provider: ${RIKE_TIKU_AI_PROVIDER:deepseek}
    base-url: ${RIKE_TIKU_AI_BASE_URL:https://api.deepseek.com}
    model: ${RIKE_TIKU_AI_MODEL:deepseek-v4-flash}
    api-key: ${RIKE_TIKU_AI_API_KEY:}
    connect-timeout: ${RIKE_TIKU_AI_CONNECT_TIMEOUT:3s}
    request-timeout: ${RIKE_TIKU_AI_REQUEST_TIMEOUT:30s}
    retry-count: ${RIKE_TIKU_AI_RETRY_COUNT:1}
