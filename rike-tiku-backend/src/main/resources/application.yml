spring:
  application:
    name: rike-tiku-backend
  datasource:
    url: jdbc:mysql://${RIKE_TIKU_DB_HOST:localhost}:${RIKE_TIKU_DB_PORT:3306}/${RIKE_TIKU_DB_NAME:rike_tiku}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${RIKE_TIKU_DB_USERNAME:root}
    password: ${RIKE_TIKU_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000

server:
  port: ${RIKE_TIKU_BACKEND_PORT:8081}

app:
  cors:
    allowed-origins: ${RIKE_TIKU_CORS_ALLOWED_ORIGINS:http://localhost:8080}

