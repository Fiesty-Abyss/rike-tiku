name: 功能建议 / Feature request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 哪个角色在什么场景下遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 其他可选方案或补充信息
